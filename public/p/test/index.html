<title>Primo&#39;s Content Calendar · November (Copy)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF7;--card:#FFFFFF;--ink:#122940;--label:#3B6E8D;--muted:#3D5468;--accent:#457D9E;--tint:#C4D9EB;--line:rgba(18,41,64,.16);
 --p1:#122940;--p2:#3B6E8D;--p3:#457D9E;--p4:#8DB4CF;--p5:#C4D9EB;--chipink:#FFFCF7;--logo:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E2033;--card:#14304B;--ink:#FFFCF7;--label:#C4D9EB;--muted:#C4D9EB;--accent:#8DB4CF;--line:rgba(255,252,247,.16);
 --p1:#FFFCF7;--p2:#C4D9EB;--p3:#8DB4CF;--p4:#457D9E;--p5:#3B6E8D;--logo:brightness(0) invert(1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E2033;--card:#14304B;--ink:#FFFCF7;--label:#C4D9EB;--muted:#C4D9EB;--accent:#8DB4CF;--line:rgba(255,252,247,.16);
 --p1:#FFFCF7;--p2:#C4D9EB;--p3:#8DB4CF;--p4:#457D9E;--p5:#3B6E8D;--logo:brightness(0) invert(1);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Montserrat,Arial,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 72px}
.hero{padding:40px 0 32px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--label);font-weight:600}
.hero img{height:30px;filter:var(--logo)}
h1{font-size:clamp(40px,7vw,68px);line-height:1.02;margin:28px 0 14px;letter-spacing:-.02em;font-weight:800}
h1 .l1{display:block;font-weight:300;color:var(--label)}
.line{font-size:17px;font-weight:400;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:36px;margin-top:28px}
.big{font-size:34px;font-weight:700;line-height:1}
.stats .muted{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:600;margin-top:4px}
h2{font-size:24px;margin:48px 0 14px;letter-spacing:-.01em;font-weight:700;display:flex;gap:14px;align-items:baseline}
h2 .no{color:var(--label);font-weight:600;font-size:15px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px;border-top:2px solid var(--ink)}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--label);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.bar{height:6px;border-radius:3px}
.fbar{display:flex;flex-wrap:wrap;gap:14px;align-items:end;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:14px 0}
.fbar label{display:flex;flex-direction:column;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);gap:6px;font-weight:600}
select,button{font:inherit;font-size:14px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.reset{cursor:pointer;background:var(--ink);color:var(--bg);border-color:var(--ink)}
#fcount{font-size:13px;margin:12px 0}
.scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:6px;min-width:780px}
.dh{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--label);font-weight:600;padding:4px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px}
.day.off{background:transparent;border-style:dashed}
.dn{font-size:12px;color:var(--muted);font-weight:600}
.chip{border:0;text-align:left;border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:600;line-height:1.3;cursor:pointer}
.chip.dim{opacity:.18}
.week{display:flex;align-items:baseline;gap:10px;margin:32px 0 6px;border-top:2px solid var(--ink);padding-top:12px}
.week h3{margin:0;font-size:16px;font-weight:700}
.post{display:grid;gap:12px}
.post-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.num{font-weight:700;color:var(--label)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.post-body{display:grid;grid-template-columns:1fr 220px;gap:24px}
@media (max-width:720px){.post-body{grid-template-columns:1fr}}
.media{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.media img{height:300px;width:auto;border-radius:8px;flex:none;background:var(--line)}.media.one img{height:340px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:2px}
.post p{margin:0 0 12px}
.ar{font-family:"IBM Plex Sans Arabic",Montserrat,sans-serif}
.cap{text-align:right;white-space:pre-line}
dl{margin:0;display:grid;gap:2px;font-size:14px;align-content:start;border-left:1px solid var(--line);padding-left:16px}
dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);font-weight:600;margin-top:8px}
dt:first-child{margin-top:0}
dd{margin:0}
footer{margin-top:48px;font-size:13px;border-top:1px solid var(--line);padding-top:14px}
</style>

 {id:"fmt",label:"Format",get:p=>[p.fmt]},{id:"plat",label:"Platform",get:p=>split(p.plat)},
 {id:"week",label:"Week",get:p=>["Week "+p.w]}];
const state={},fbar=document.getElementById("fbar");
F.forEach(f=>{state[f.id]="All";const vals=f.opts||[...new Set(P.flatMap(f.get))];
 const l=document.createElement("label");l.textContent=f.label;const s=document.createElement("select");s.id="flt-"+f.id;
 s.innerHTML='<option>All</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join("");
 s.onchange=()=>{state[f.id]=s.value;update()};l.appendChild(s);fbar.appendChild(l)});
const rb=document.createElement("button");rb.className="reset";rb.textContent="Clear filters";
rb.onclick=()=>{F.forEach(f=>{state[f.id]="All";document.getElementById("flt-"+f.id).value="All"});update()};fbar.appendChild(rb);
const match=p=>F.every(f=>state[f.id]=="All"||f.get(p).includes(state[f.id]));

function renderCal(){
 let h=DOW.map(d=>`<div class="dh">${d}</div>`).join("");
 const cells=Math.ceil((first+days)/7)*7;
 for(let i=0;i<cells;i++){const d=i-first+1;
  if(d<1||d>days){h+='<div class="day off"></div>';continue}
  h+=`<div class="day"><div class="dn">${d}${CLIENT.shootDays.includes(d)?" · Shoot":""}</div>`+
   P.filter(p=>p.d==d).map(p=>`<button class="chip${match(p)?"":" dim"}" style="${pst(p.pillar)}" data-n="${p.n}">#${p.n} · ${esc(p.fmt)}</button>`).join("")+"</div>"}
 const c=document.getElementById("cal");c.innerHTML=h;
 c.querySelectorAll(".chip").forEach(b=>b.onclick=()=>document.getElementById("post-"+b.dataset.n)?.scrollIntoView({behavior:"smooth"}))}

function render(){const list=P.filter(match);let h="",lw=0;
 list.forEach(p=>{if(p.w!==lw){lw=p.w;h+=`<div class="week"><h3>Week ${p.w}</h3><span class="muted">${list.filter(x=>x.w==p.w).length} posts</span></div>`}
  h+=`<article class="card post" id="post-${p.n}" style="scroll-margin-top:16px">
  <div class="post-head"><span class="num">#${p.n}</span><span class="tag">${esc(p.date)}</span><span class="pill" style="${pst(p.pillar)}">${esc(p.pillar)}</span></div>
  ${IMG[p.k||p.d]?`<div class="media${IMG[p.k||p.d]==1?" one":""}">${Array.from({length:IMG[p.k||p.d]},(_,i)=>`<img loading="lazy" src="img/d${p.k||p.d}-${i+1}.jpg" alt="Post ${p.n} · ${i+1}">`).join("")}</div>`:""}
  <div class="post-body"><div>
   <div class="lbl">Idea / hook</div><p>${ar(p.hook)}</p>
   <div class="lbl">On-screen copy</div><p>${ar(p.copy)}</p>
   <div class="lbl">Caption</div><p ${isAr(p.cap)?'dir="rtl" class="ar cap"':""}>${esc(p.cap)}</p>
  </div><dl><dt>Format</dt><dd>${esc(p.fmt)}</dd><dt>Platform</dt><dd>${esc(p.plat)}</dd></dl></div></article>`});
 document.getElementById("posts").innerHTML=h||'<p class="muted">No posts match these filters.</p>'}
function update(){document.getElementById("fcount").textContent=`Showing ${P.filter(match).length} of ${P.length} posts. Click a post in the calendar to open it.`;renderCal();render()}
update();
</script>

</body></html>
